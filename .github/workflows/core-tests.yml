name: Core tests

on:
  push:
  pull_request:

jobs:
  test:
    # macOS: GRDB needs SQLite's snapshot API, which Apple's SQLite has and Ubuntu's doesn't.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run TaskCore and TaskStore tests
        run: swift test --package-path Packages/TaskCore

  supabase-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the sync SQL tests against Postgres
        run: scripts/test-supabase.sh
