# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Daybook
options:
  bundleIdPrefix: com.nazmulhoque
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TaskCore:
    path: Packages/TaskCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Daybook:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: TaskCore
        product: TaskCore
      - package: TaskCore
        product: TaskStore
      - target: DaybookWidgets
      - target: DaybookShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nazmulhoque.daybook
        PRODUCT_NAME: Daybook
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daybook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: App/Daybook.entitlements
    info:
      # Merged with the generated Info.plist. The URL scheme lets sign-in links in emails open the app.
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.nazmulhoque.daybook
            CFBundleURLSchemes: [daybook]
        # Background refresh: sync now and then while the app isn't open (BackgroundRefresh.swift).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.nazmulhoque.daybook.sync]

  DaybookWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: TaskCore
        product: TaskCore
      - package: TaskCore
        product: TaskStore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nazmulhoque.daybook.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/DaybookWidgets.entitlements
        SKIP_INSTALL: YES

  DaybookShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    dependencies:
      - package: TaskCore
        product: TaskCore
      - package: TaskCore
        product: TaskStore
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nazmulhoque.daybook.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Share/DaybookShare.entitlements
        SKIP_INSTALL: YES
